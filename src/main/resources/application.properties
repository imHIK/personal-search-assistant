# ---- HTTP ----
quarkus.http.port=8080

# ---- Web console ----
# The React console lives in `frontend/`. `./gradlew build` runs its npm build (see build.gradle)
# into src/main/resources/META-INF/resources, so Quarkus serves the UI from :8080 in the packaged
# app — one origin, which is why no CORS configuration exists here. During development, run the
# Vite dev server (`cd frontend && npm run dev`) and use :5173: it proxies /api and /q to :8080,
# so that is also a single origin. Do not "fix" anything here by adding quarkus.http.cors.
# SPA deep links (/knowledge/kn_123) are served index.html by SpaRoutingConfigurator.

# ---- MongoDB (source of truth) ----
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=personal_assistant

# ---- OpenSearch (query engine) ----
# Read by the OpenSearch client producer (added when the adapter is implemented).
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=http
opensearch.index.chunks=chunks

# ---- Embeddings ----
# Pinned to the model + dimension used in the OpenSearch knn_vector mapping.
# Which EmbeddingProvider is active (matched against each provider's providerId()):
#   onnx-bge       -> OnnxEmbeddingProvider              (local, private, in-JVM ONNX; default)
#   openai-embed   -> OpenAiCompatibleEmbeddingProvider  (hosted: Gemini/Jina/Mistral/Ollama/…)
#   local-hashing  -> LocalHashingEmbeddingProvider      (offline baseline for dev/tests)
# The choice is STICKY: dimension below is baked into the OpenSearch knn_vector mapping, so changing
# to a model with a different width means re-mapping + re-indexing. bge-base-en-v1.5 is natively
# 768-dim and gemini-embedding-001 is asked for 768 (see app.embedding.openai.dimensions), so both
# fit the same mapping. Note that swapping models still invalidates existing vectors even at equal
# width — two models embed into different spaces — so a swap always means re-indexing the corpus.
app.embedding.provider=openai-embed
# Shared, index-pinned vector width. MUST equal the active model's output width.
app.embedding.dimension=768
# Legacy label used only by the local-hashing baseline.
app.embedding.model=local-hashing-v1

# Local ONNX provider (app.embedding.provider=onnx-bge). Point model-path at a directory holding the
# exported model.onnx + tokenizer.json + config.json (see docs/providers.md for the one-line export).
app.embedding.onnx.model=bge-base-en-v1.5
app.embedding.onnx.model-path=
app.embedding.onnx.pooling=cls
app.embedding.onnx.normalize=true
# Instruction prepended to a QUERY (never a document) before embedding. BGE models are trained with one
# and their docs recommend it for retrieval; the value below is BGE's published wording. Leave blank for
# a symmetric model — the wrong instruction is worse than none. The separating space is added in code, so
# no trailing whitespace is needed here (spotless would strip it anyway).
app.embedding.onnx.query-instruction=Represent this sentence for searching relevant passages:

# Hosted OpenAI-compatible provider (app.embedding.provider=openai-embed). Defaults to Gemini's
# OpenAI-compatible endpoint; the key is sourced from the GEMINI_API_KEY env var if set.
app.embedding.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# Gemini's OpenAI-compatible layer requires the full resource name, `models/<id>` — a bare id 404s
# with "Requested entity was not found", the same message a retired model gives. GET {base-url}/models
# lists the exact ids this key can use.
app.embedding.openai.model=models/gemini-embedding-001
app.embedding.openai.api-key=${GEMINI_API_KEY:}
# Width to request via the OpenAI `dimensions` parameter; 0 omits it and takes the model's native
# width. gemini-embedding-001 is natively 3072, so this is what keeps it inside the 768 knn mapping.
# It is Matryoshka-trained, so the 768 prefix is a real embedding, not a crop; the mapping uses
# cosinesimil, which re-normalises internally, so the truncated vector needs no extra normalization.
app.embedding.openai.dimensions=768
app.embedding.openai.timeout-seconds=60
# Send task_type so a QUERY embedding is distinguished from a DOCUMENT one. OFF, and it must stay off
# for the base-url above: task_type is a NATIVE Gemini parameter, and the OpenAI-compatible endpoint
# validates strictly and rejects it with "400 Invalid JSON payload received. Unknown name \"task_type\"",
# which fails every embedding call and therefore all indexing. Enable only against an endpoint documented
# to accept it. The asymmetry is worth having — both configured models are asymmetrically trained — but
# the compat layer exposes no way to signal query vs document. The ONNX provider gets it via
# app.embedding.onnx.query-instruction instead.
app.embedding.openai.task-type-enabled=false

# ---- Search (read path) ----
# Length of the display excerpt on each hit. This is a DISPLAY concern only — the agent is grounded in
# the full chunk text, not the snippet. It used to be a hardcoded 280 applied before the text reached
# the agent, which meant grounded answers saw roughly a quarter of every chunk and would report the
# unseen remainder of a list as missing from the source. Set to 0 to return chunks untruncated.
app.search.snippet-chars=280
# Highlight fragments requested per field, so the excerpt shows the region that matched rather than the
# head of the chunk. 0 disables highlighting (the excerpt then always starts at the beginning). Only the
# lexical leg can highlight — a knn query has no query terms to mark up.
app.search.highlight-fragments=2
# Ceiling on topK. topK is multiplied by candidate-multiplier before it becomes the OpenSearch `size`
# and the knn `k`, so this is what stops one request asking the cluster for an unbounded result set.
app.search.max-top-k=100
# Candidates fetched per leg per requested result. Over-fetch feeds fusion and reranking: a chunk that
# only one leg ranks well needs to survive long enough to reach the fusion step.
app.search.candidate-multiplier=4
# BM25 query shape. The defaults exist because a bare multi_match scores a document for matching ANY
# term: "give me all the holidays this year" ranked documents containing give/all/this/year above the
# one document about holidays, and then filled the candidate set with them — crowding the vector leg's
# correct hits out of the RRF fusion. minimum-should-match requires a real share of the query to match;
# the title boost stops a short unrelated chunk outranking the document named for the query.
# Blank minimum-should-match sends nothing (OR-any-term); a 0 phrase-boost omits the phrase clause.
app.search.lexical.fields=text,title^2
app.search.lexical.type=best_fields
app.search.lexical.minimum-should-match=2<70%
app.search.lexical.phrase-boost=2.0
# RRF: rank-smoothing constant, then per-leg weights on the fused score. Larger rrf-k rewards agreement
# between the legs over either leg's exact ordering. Lower a weight to discount a leg you trust less on
# your corpus — a blunt instrument next to fixing the query shape above.
app.search.rrf-k=60
app.search.rrf.lexical-weight=1.0
app.search.rrf.vector-weight=1.0
# Cap on how many chunks one entity may contribute; 0 = unlimited. OFF by default on purpose: it buys
# source diversity, but it actively harms the case where the right answer IS many chunks of one document
# (a long table, one long report). Reach for it only when results are visibly swamped by one document.
# A caller may override this per request (SearchRequestDto.maxChunksPerEntity) when it knows its corpus
# is record-shaped rather than document-shaped — set 1 for "one result per job posting".
app.search.max-chunks-per-entity=0

# ---- Searching BY a document (sourceEntityId) ----
# The document is decomposed into a few short queries and their rankings are fused, rather than being
# used as one long query: a several-hundred-word multi_match degenerates, and one embedding of a long
# document is a centroid near nothing in particular.
# Ceiling on the source document. Past this it is a mistake (a book, not a CV) and is REJECTED with a
# 400 — truncating would draw facets from whichever pages came first and look like a working search.
app.search.document-query.max-chars=40000
# Ceiling on derived facets. Each costs a full retrieval round trip, so this stops a model's verbosity
# from deciding how expensive a search is.
app.search.document-query.max-facets=8
# Chunks read back when the document's text must be reassembled from the index — which is the NORMAL
# path for a file-backed entity (LOCAL_FS keeps only a fileRef, never inline text).
app.search.document-query.max-chunks=50

# ---- Duplicate collapsing (opt-in per request: collapseDuplicates) ----
# Groups results that are the same material reached by different routes: the same file in Drive and as a
# mail attachment, a forwarded thread, one role listed on two boards. Non-destructive — it reorders a
# result list, it never touches the index — and inert unless a request asks for it.
# Token width of a shingle. Long enough that ordinary shared phrasing between two DIFFERENT documents
# does not register; short enough to survive light editing of a genuine copy.
app.search.dedupe.shingle-size=5
# Jaccard overlap at which two hits are called the same material. HIGH on purpose: a false merge hides a
# result with no way for the user to notice, while a missed merge is just a visible duplicate. Not HIGHER
# because overlap is length-sensitive — a fixed boilerplate header costs proportionally more on a short
# chunk, and an aggregator prefixing three words to a 30-token posting already lands near 0.89.
app.search.dedupe.near-duplicate-threshold=0.85
# Cap on the pairwise near-duplicate pass, which is O(n^2) in candidates. Beyond it the two exact layers
# (identical text, equal metadata.dedupeKey) still apply.
app.search.dedupe.max-comparisons=100

# ---- LLM (grounded answers) ----
# Which LlmProvider is active:
#   openai-compat -> OpenAiCompatibleLlmProvider (hosted Groq/Gemini/… or local Ollama; default)
#   none          -> StubLlmProvider             (throws on use; disables answering)
# Defaults target Groq's free tier. To run locally later: set base-url=http://localhost:11434/v1,
# model=llama3.1:8b, and leave the api-key blank — no code change.
# NOTE: Groq retires models; a 404 saying the model "does not exist or you do not have access"
# means this id is stale, not that the key is wrong. Check GET /openai/v1/models.
app.llm.provider=openai-compat
app.llm.base-url=https://api.groq.com/openai/v1
app.llm.model=openai/gpt-oss-120b
app.llm.api-key=${GROQ_API_KEY:}
app.llm.temperature=0.2
app.llm.timeout-seconds=60

# ---- LLM profiles (per-role model selection) ----
# A profile is a named set of per-call overrides on top of the app.llm.* defaults above, resolved
# dynamically from app.llm.profile.<name>.<key> — so giving a new feature its own model is a config
# edit, not a new bean. Recognised keys: base-url, model, temperature, max-tokens, api-key. Any key
# left out (or blank) inherits the provider default; a profile with no keys at all inherits everything.
# Set base-url to move one role to a different endpoint — supply that endpoint's api-key with it, since
# a redirected profile deliberately does NOT fall back to the provider's key.
#
# `answer` is the profile the answering TASK references (config/prompts.json). max-tokens matters: nothing was
# sent before, so the vendor default applied and a long list answer could be cut off silently.
app.llm.profile.answer.model=openai/gpt-oss-120b
app.llm.profile.answer.temperature=0.2
app.llm.profile.answer.max-tokens=2048
# `lite` is the cheap/fast model for bulk or background work — the job-fit scoring and the
# document-facets extraction both run on it.
#
# It names the SAME model as `answer` today, which defeats the point of a cheap tier, and that is
# deliberate rather than an oversight: both tasks ask for responseFormat=JSON_OBJECT, and of the models
# this account can reach only gpt-oss-120b honours it. The smaller ones (gpt-oss-20b, qwen3.6-27b) are
# rejected SERVER-SIDE with "Failed to validate JSON" before a reply is returned, so the tolerant parser
# in JsonReplies cannot rescue them — the request simply fails. Point this at a smaller model as soon as
# one that supports JSON mode is available; the profile exists so that is a config edit.
app.llm.profile.lite.model=openai/gpt-oss-120b
app.llm.profile.lite.temperature=0.0
app.llm.profile.lite.max-tokens=512

# ---- Answer synthesis (agent) ----
# Which TASK in config/prompts.json answering runs. The task carries its own prompt, LLM profile and
# budgets (contextChars / maxSources), so a variant — list-mode, summarisation — is a JSON entry plus
# this key, not a second code path.
#
# Those budgets deliberately do NOT live here. They are per-task, not global: answering and a future
# summarisation want different values, and one flat key cannot express both. See docs/configuration.md
# for where a new setting belongs.
app.agent.task=answer
# Optional: replace the bundled config/prompts.json wholesale with a file on disk. Blank = use the
# bundled catalogue. This is the seam for user-supplied prompts later.
app.prompts.path=
# Optional: replace the bundled config/field-sets.json wholesale with a file on disk.
app.field-sets.path=

# ---- Connectors: Google (Gmail + Drive) ----
# Per-knowledge OAuth material (accessToken / refreshToken / expiry) lives in the knowledge's opaque
# connectorDetails.auth blob — see docs/connectors.md. The app-level OAuth client below is the
# fallback used to mint access tokens from a refresh token when the auth blob doesn't carry its own
# clientId/clientSecret. Leave blank to require ready-to-use access tokens in the auth blob instead.
app.ingestion.google.token-url=https://oauth2.googleapis.com/token
app.ingestion.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.ingestion.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Gmail REST API.
app.ingestion.gmail.base-url=https://gmail.googleapis.com/gmail/v1
app.ingestion.gmail.timeout-seconds=60

# Google Drive REST API. Binary (non-native) files are downloaded to download-dir and referenced by
# fileRef so the Tika indexing path parses them; blank download-dir => ${java.io.tmpdir}/psa-drive.
# max-file-bytes skips oversized downloads; max-folders bounds the discovery folder-tree walk.
app.ingestion.google-drive.base-url=https://www.googleapis.com/drive/v3
app.ingestion.google-drive.timeout-seconds=60
app.ingestion.google-drive.download-dir=
app.ingestion.google-drive.max-file-bytes=26214400
app.ingestion.google-drive.max-folders=500

# ---- ATS job boards (Greenhouse / Lever / Ashby) ----
# All three are PUBLIC job-board endpoints: no credentials, so these connectors need no Connection.
# Each returns a whole board in one response, so there is no page-size knob to tune here.
app.ingestion.greenhouse.base-url=https://boards-api.greenhouse.io/v1/boards
app.ingestion.greenhouse.timeout-seconds=30
app.ingestion.lever.base-url=https://api.lever.co/v0/postings
app.ingestion.lever.timeout-seconds=30
app.ingestion.ashby.base-url=https://api.ashbyhq.com/posting-api/job-board
app.ingestion.ashby.timeout-seconds=30
# SmartRecruiters is the one platform that pays PER POSTING: its listing omits the description, so each
# posting needs a second call. The location filter is applied to the listing first to keep that bounded.
app.ingestion.smartrecruiters.base-url=https://api.smartrecruiters.com/v1/companies
app.ingestion.smartrecruiters.timeout-seconds=30
# Workday has no base-url: the host is derived from each site's tenant/pod triple.
app.ingestion.workday.timeout-seconds=30
# Oracle Recruiting Cloud, likewise: the host is per-customer and comes from the site's host/siteNumber
# pair. It pays per posting like SmartRecruiters -- its listing carries no description at all -- so the
# location terms are sent as Oracle's `keyword` finder to bound the number of detail calls.
app.ingestion.oraclehcm.timeout-seconds=30

# ---- Chunking ----
# Default strategy for a knowledge that hasn't customised chunking. One of:
#   recursive   -> RecursiveCharacterChunkingStrategy (paragraph->line->sentence->word->char; RAG default)
#   character   -> CharacterChunkingStrategy          (split on a single separator, merge to size)
#   fixed-size  -> FixedSizeChunkingStrategy           (blind sliding character window)
#   token       -> TokenChunkingStrategy               (size/overlap counted in real tokens)
#   table       -> TableAwareChunkingStrategy          (row-aligned, repeats the header row per chunk)
# A knowledge overrides this per-knowledge via POST/PATCH /api/knowledge (config.chunking); changing it
# is a direct update — new chunks use the new strategy, already-indexed chunks are left untouched.
app.chunking.strategy=recursive
# Let content type pick the strategy when a knowledge has NOT chosen one explicitly, so a spreadsheet in
# a knowledge of mostly prose still gets chunked by row. An explicit per-knowledge choice always wins.
# Set false to go back to name-only selection.
#
# This matters because a table split naively gives its first chunk the column headers and every later
# chunk bare values — and a chunk of bare values matches neither the query's words nor its meaning, so it
# never reaches the top-k and the answer silently omits half the table. The `table` strategy repeats the
# header row into every chunk so each one is retrievable on its own merit. Note it needs real table
# markup from the parser: PDFs have no table semantics (a visual table arrives as separate lines), so
# there the win comes from chunk sizing and the embedded context prefix instead.
app.chunking.mime-aware=true
# Character-based size + overlap (used by recursive | character | fixed-size), in characters.
app.chunking.size=1000
app.chunking.overlap=150
# Token-based size + overlap (used by the token strategy), in tokens — sized to fit the embedding
# model's context window. The tokenizer is loaded lazily via DJL/HuggingFace; if it can't be fetched
# (offline) the token strategy falls back to a ~4-chars/token approximation so indexing never breaks.
app.chunking.token.size=256
app.chunking.token.overlap=32
app.chunking.token.tokenizer=bert-base-uncased

# ---- Outbound rate limiting ----
# Ceilings on calls this app MAKES to other services (boards, Gmail/Drive, the LLM and embedding
# endpoints). Distinct from app.*.permits.*, which cap how many run AT ONCE: these cap how many
# start PER UNIT OF TIME, and a call may pass through both.
#
# Rules are "<permits>/<window>", comma-separated, window suffixed s/m/h/d. Several windows compose
# and a call must satisfy all of them: 10/1s,500/1m,10000/1d. Blank means no limit, which is the
# shipped default — nothing throttles until you say so.
#
# Each rule is a ROLLING window: 60/1d admits 60 calls back to back and then nothing until those calls
# are a day old, rather than dripping one back every 24 minutes. That is the tighter of the two ways a
# service counts, so it satisfies a rolling server exactly and a fixed-window one with room to spare.
#
# How long a background call may block waiting for the window to reopen. Beyond this it is not failed but
# DEFERRED: the runner writes the reopening instant onto the entity or cursor and picks the work up
# later, so a daily quota never parks a scheduler thread. Keep it well under the shortest lease
# (app.ingestion.lease-seconds=900) so a waiting worker cannot outlive its own lease.
app.ratelimit.max-wait-seconds=60
# Pause applied when a 429 arrives with no usable Retry-After header.
app.ratelimit.default-retry-after-seconds=60
# Ceiling on a server-supplied Retry-After. That header is remote input (delta-seconds and HTTP-dates
# get confused for each other in the wild) and the instant it produces is load-bearing: a rate-limited
# cursor is held out of the claim batch until it passes. If the server really meant longer, the next
# call earns another 429 and another pause.
app.ratelimit.max-penalty-seconds=21600
# Consecutive rate-limit deferrals before an entity or cursor is dead-lettered. Deliberately far
# higher than app.indexing.retry-limit: a deferral is the limiter working as intended, not a fault,
# and counting it as one would park healthy work FAILED after five throttled attempts. Both sides now
# defer to the reopening instant rather than to the next poll tick, so one deferral is one genuine
# reopening that still hit the wall — this is a slow backstop for a limit set to something
# unsatisfiable, not a timer.
app.ratelimit.max-deferrals=20
# Per-area operator defaults. An account's own limit (set in the console, stored on the connection)
# overrides the per-connector default below.
app.ratelimit.job-boards.rules=
app.ratelimit.llm.rules=
app.ratelimit.embedding.rules=6/1m,60/1d
# Per-connector defaults are resolved dynamically as app.ratelimit.connector.<SOURCE_TYPE>.rules, so
# a new connector needs no code change. Uncomment to set one, e.g.:
# app.ratelimit.connector.GMAIL.rules=20/1s,15000/1m
# app.ratelimit.connector.GOOGLE_DRIVE.rules=10/1s,12000/1m

# ---- Ingestion stage (Stage 1: source -> Mongo) ----
app.ingestion.poll-interval=30s
app.ingestion.poll-batch=20
app.ingestion.batches-per-lease=50
app.ingestion.max-items-per-batch=100
# Cursor lease TTL. MUST comfortably exceed the worst-case time to fetch+persist a SINGLE page
# (the per-page renew covers multi-page leases, but cannot protect one page that outlives the TTL).
# Trade-off: a larger value means a crashed worker's cursor is reclaimed more slowly. Keep
# max-items-per-batch small enough that one page finishes well within this window.
app.ingestion.lease-seconds=900
app.ingestion.retry-limit=5
# Scoped concurrency ceilings so one source can't starve the rest.
app.ingestion.permits.global=8
app.ingestion.permits.connector=4
app.ingestion.permits.knowledge=2
# Permit TTL: auto-reclaim window if a worker dies mid-run. The permit is renewed per page (same
# point as the cursor lease), so it must outlive a single page just like the lease — keep it >=
# app.ingestion.lease-seconds so the permit never lapses while the lease is still held.
app.ingestion.permits.ttl-seconds=14400

# ---- Forward scheduler (re-arms forward cursors) ----
# Scheduler TICK granularity: how often the scheduler wakes to check which knowledges are DUE for a
# forward re-arm. This bounds scheduling resolution (a knowledge can fire no more often than this),
# NOT how often any given source actually syncs — that is the per-source resolved schedule below.
# Keep it <= the smallest schedule you expect to use.
app.scheduler.forward-interval=1m
# How often to re-discover iterables for sources with a growing sub-stream set (new folders/channels).
app.scheduler.discovery-interval=60m
# 3-tier forward-sync schedule resolution: a knowledge's own custom schedule (cron/interval) wins;
# else the connector's defaultSchedule() (e.g. LOCAL_FS = 1 day); else this GLOBAL default. Set a
# global cron to pin a wall-clock time instead of an interval (cron wins over interval if both set).
app.scheduler.default-interval=1d
app.scheduler.default-cron=

# ---- Connection health ----
# How often stored credentials are re-checked. Credentials are otherwise only verified at create and on
# an auth edit, so a token that expires later leaves its connection reading ACTIVE while every sync
# fails — the failures scroll past in the log and the first real signal is stale data.
# A connection found broken is marked ERROR, and IngestionJob then SKIPS its knowledges rather than
# burning a lease and a permit per tick to fail. Nothing is paused: the skip is derived from the
# connection's status, so recovery is automatic and a user's own pause is never overridden.
app.connections.health-interval=30m

# ---- Retention (ageing entities out) ----
# How often the sweeper wakes. It only tombstones; the ordinary deletion path in IndexingJob does the
# actual chunk removal, so this is bounded, cheap work and does not need to be frequent.
app.retention.poll-interval=1h
# Max entities tombstoned per pass per tick, so one huge knowledge can't stall the scheduler thread.
app.retention.batch=200
# 3-tier retention resolution, mirroring the schedule tiers above: a knowledge's own window wins;
# else the connector's defaultRetention() (feed-like sources only); else this GLOBAL default.
# DELIBERATELY BLANK. Unset at every tier means "never expire", which is what a document corpus must
# do — a global window here would silently start deleting Drive/Gmail/local content. Only set this if
# every knowledge in this deployment is a feed.
app.retention.default-period=

# ---- Digests (scheduled saved searches) ----
# Scheduler TICK granularity, like app.scheduler.forward-interval: it bounds how precisely a digest can
# fire, NOT how often any digest runs — that is each digest's own cron/interval, resolved by the same
# ScheduleResolver. Keep it <= the shortest digest cadence you expect to use.
app.digest.poll-interval=5m
# Digests run per tick, so a burst of due digests can't monopolise the scheduler thread.
app.digest.batch=10
# Extra candidates fetched when a digest reports only NEW items. The already-seen filter runs after
# retrieval, so without over-fetching a digest whose top results are all familiar reports nothing while
# new items sat just below the cut.
app.digest.new-item-multiplier=4

# ---- Indexing stage (Stage 2: Mongo -> OpenSearch) ----
app.indexing.poll-interval=5s
# Global budget of entities indexed per tick, the per-knowledge quota per tick (round-robin
# fairness so one backlog can't starve others), and the cap on distinct knowledges scanned.
app.indexing.batch=20
app.indexing.per-knowledge=5
app.indexing.max-knowledges=200
app.indexing.concurrency=4
app.indexing.embed-batch=15
# NOTE: which metadata is prefixed before embedding now lives in config/field-sets.json under
# "embedContext", because it varies per connector — a Gmail chunk is best identified by sender, a Drive
# chunk by its heading path — and a flat key here can only say one thing. Override the whole file with
# app.field-sets.path below.
app.indexing.lease-seconds=900
# Permit TTL: the indexing permit is held for a WHOLE tick (acquired once, released in finally, not
# renewed mid-tick), so it must exceed the worst-case time to process one tick's batch — comfortably
# above the per-entity lease. Raise if ticks process many slow/large entities.
app.indexing.permits.ttl-seconds=1200
app.indexing.retry-limit=5
app.indexing.backoff-seconds=300
# Whether a re-index goes back to the source for content first. "auto" asks the connector
# (SourceConnector.defaultReindexMode: GOOGLE_DRIVE fetches because its fileRef is a staged copy in a
# dir the OS may purge; everything else re-indexes what is stored). "always" forces a fetch for every
# file-backed entity, "never" restores the old behaviour of always trusting the stored reference —
# useful to make a purged staged file dead-letter loudly instead of silently re-downloading.
app.indexing.refetch-on-reindex=auto

# ---- Dev niceties ----
quarkus.log.category."io.personalassistant".level=DEBUG

# ---- Infrastructure ownership ----
# Infra (MongoDB + OpenSearch) is managed by docker-compose, NOT by Quarkus.
# Disable the Compose dev service so the app just connects to the running containers
# instead of trying to start/stop Docker itself.
quarkus.compose.devservices.enabled=false
