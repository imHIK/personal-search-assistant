# ---- HTTP ----
quarkus.http.port=8080

# ---- MongoDB (source of truth) ----
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=personal_assistant

# ---- OpenSearch (query engine) ----
# Read by the OpenSearch client producer (added when the adapter is implemented).
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=http
opensearch.index.chunks=chunks

# ---- Embeddings ----
# Pinned to the model + dimension used in the OpenSearch knn_vector mapping.
# Default provider is LocalHashingEmbeddingProvider (offline, deterministic). To use a real
# semantic model, provide a different EmbeddingProvider bean, update model + dimension here to
# match it (e.g. all-MiniLM-L6-v2 / 384), and re-index.
app.embedding.model=local-hashing-v1
app.embedding.dimension=384

# ---- Chunking ----
app.chunking.size=1000
app.chunking.overlap=150

# ---- Ingestion stage (Stage 1: source -> Mongo) ----
app.ingestion.poll-interval=30s
app.ingestion.poll-batch=20
app.ingestion.batches-per-lease=50
app.ingestion.max-items-per-batch=100
# Cursor lease TTL. MUST comfortably exceed the worst-case time to fetch+persist a SINGLE page
# (the per-page renew covers multi-page leases, but cannot protect one page that outlives the TTL).
# Trade-off: a larger value means a crashed worker's cursor is reclaimed more slowly. Keep
# max-items-per-batch small enough that one page finishes well within this window.
app.ingestion.lease-seconds=900
app.ingestion.retry-limit=5
# Scoped concurrency ceilings so one source can't starve the rest.
app.ingestion.permits.global=8
app.ingestion.permits.connector=4
app.ingestion.permits.knowledge=2
# Permit TTL: auto-reclaim window if a worker dies mid-run. The permit is renewed per page (same
# point as the cursor lease), so it must outlive a single page just like the lease — keep it >=
# app.ingestion.lease-seconds so the permit never lapses while the lease is still held.
app.ingestion.permits.ttl-seconds=14400

# ---- Forward scheduler (re-arms forward cursors) ----
app.scheduler.forward-interval=60m
# How often to re-discover iterables for sources with a growing sub-stream set (new folders/channels).
app.scheduler.discovery-interval=60m

# ---- Indexing stage (Stage 2: Mongo -> OpenSearch) ----
app.indexing.poll-interval=5s
# Global budget of entities indexed per tick, the per-knowledge quota per tick (round-robin
# fairness so one backlog can't starve others), and the cap on distinct knowledges scanned.
app.indexing.batch=20
app.indexing.per-knowledge=5
app.indexing.max-knowledges=200
app.indexing.concurrency=4
app.indexing.embed-batch=64
app.indexing.lease-seconds=120
# Permit TTL: the indexing permit is held for a WHOLE tick (acquired once, released in finally, not
# renewed mid-tick), so it must exceed the worst-case time to process one tick's batch — comfortably
# above the per-entity lease. Raise if ticks process many slow/large entities.
app.indexing.permits.ttl-seconds=300
app.indexing.retry-limit=5
app.indexing.backoff-seconds=30

# ---- Dev niceties ----
quarkus.log.category."io.personalassistant".level=DEBUG

# ---- Infrastructure ownership ----
# Infra (MongoDB + OpenSearch) is managed by docker-compose, NOT by Quarkus.
# Disable the Compose dev service so the app just connects to the running containers
# instead of trying to start/stop Docker itself.
quarkus.compose.devservices.enabled=false
