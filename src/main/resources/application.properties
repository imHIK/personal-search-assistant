# ---- HTTP ----
quarkus.http.port=8080

# ---- MongoDB (source of truth) ----
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=personal_assistant

# ---- OpenSearch (query engine) ----
# Read by the OpenSearch client producer (added when the adapter is implemented).
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=http
opensearch.index.chunks=chunks

# ---- Embeddings ----
# Pinned to the model + dimension used in the OpenSearch knn_vector mapping.
# Which EmbeddingProvider is active (matched against each provider's providerId()):
#   onnx-bge       -> OnnxEmbeddingProvider              (local, private, in-JVM ONNX; default)
#   openai-embed   -> OpenAiCompatibleEmbeddingProvider  (hosted: Gemini/Jina/Mistral/Ollama/…)
#   local-hashing  -> LocalHashingEmbeddingProvider      (offline baseline for dev/tests)
# The choice is STICKY: dimension below is baked into the OpenSearch knn_vector mapping, so changing
# to a model with a different width means re-mapping + re-indexing. Both defaults below
# (bge-base-en-v1.5 and text-embedding-004) are 768-dim, so they are interchangeable with no re-index.
app.embedding.provider=onnx-bge
# Shared, index-pinned vector width. MUST equal the active model's output width.
app.embedding.dimension=768
# Legacy label used only by the local-hashing baseline.
app.embedding.model=local-hashing-v1

# Local ONNX provider (app.embedding.provider=onnx-bge). Point model-path at a directory holding the
# exported model.onnx + tokenizer.json + config.json (see docs/providers.md for the one-line export).
app.embedding.onnx.model=bge-base-en-v1.5
app.embedding.onnx.model-path=
app.embedding.onnx.pooling=cls
app.embedding.onnx.normalize=true

# Hosted OpenAI-compatible provider (app.embedding.provider=openai-embed). Defaults to Gemini's
# OpenAI-compatible endpoint; the key is sourced from the GEMINI_API_KEY env var if set.
app.embedding.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
app.embedding.openai.model=text-embedding-004
app.embedding.openai.api-key=${GEMINI_API_KEY:}
app.embedding.openai.timeout-seconds=60

# ---- LLM (grounded answers) ----
# Which LlmProvider is active:
#   openai-compat -> OpenAiCompatibleLlmProvider (hosted Groq/Gemini/… or local Ollama; default)
#   none          -> StubLlmProvider             (throws on use; disables answering)
# Defaults target Groq's free tier. To run locally later: set base-url=http://localhost:11434/v1,
# model=llama3.1:8b, and leave the api-key blank — no code change.
app.llm.provider=openai-compat
app.llm.base-url=https://api.groq.com/openai/v1
app.llm.model=llama-3.3-70b-versatile
app.llm.api-key=${GROQ_API_KEY:}
app.llm.temperature=0.2
app.llm.timeout-seconds=60

# ---- Connectors: Google (Gmail + Drive) ----
# Per-knowledge OAuth material (accessToken / refreshToken / expiry) lives in the knowledge's opaque
# connectorDetails.auth blob — see docs/connectors.md. The app-level OAuth client below is the
# fallback used to mint access tokens from a refresh token when the auth blob doesn't carry its own
# clientId/clientSecret. Leave blank to require ready-to-use access tokens in the auth blob instead.
app.ingestion.google.token-url=https://oauth2.googleapis.com/token
app.ingestion.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.ingestion.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Gmail REST API.
app.ingestion.gmail.base-url=https://gmail.googleapis.com/gmail/v1
app.ingestion.gmail.timeout-seconds=60

# Google Drive REST API. Binary (non-native) files are downloaded to download-dir and referenced by
# fileRef so the Tika indexing path parses them; blank download-dir => ${java.io.tmpdir}/psa-drive.
# max-file-bytes skips oversized downloads; max-folders bounds the discovery folder-tree walk.
app.ingestion.google-drive.base-url=https://www.googleapis.com/drive/v3
app.ingestion.google-drive.timeout-seconds=60
app.ingestion.google-drive.download-dir=
app.ingestion.google-drive.max-file-bytes=26214400
app.ingestion.google-drive.max-folders=500

# ---- Chunking ----
app.chunking.size=1000
app.chunking.overlap=150

# ---- Ingestion stage (Stage 1: source -> Mongo) ----
app.ingestion.poll-interval=30s
app.ingestion.poll-batch=20
app.ingestion.batches-per-lease=50
app.ingestion.max-items-per-batch=100
# Cursor lease TTL. MUST comfortably exceed the worst-case time to fetch+persist a SINGLE page
# (the per-page renew covers multi-page leases, but cannot protect one page that outlives the TTL).
# Trade-off: a larger value means a crashed worker's cursor is reclaimed more slowly. Keep
# max-items-per-batch small enough that one page finishes well within this window.
app.ingestion.lease-seconds=900
app.ingestion.retry-limit=5
# Scoped concurrency ceilings so one source can't starve the rest.
app.ingestion.permits.global=8
app.ingestion.permits.connector=4
app.ingestion.permits.knowledge=2
# Permit TTL: auto-reclaim window if a worker dies mid-run. The permit is renewed per page (same
# point as the cursor lease), so it must outlive a single page just like the lease — keep it >=
# app.ingestion.lease-seconds so the permit never lapses while the lease is still held.
app.ingestion.permits.ttl-seconds=14400

# ---- Forward scheduler (re-arms forward cursors) ----
# Scheduler TICK granularity: how often the scheduler wakes to check which knowledges are DUE for a
# forward re-arm. This bounds scheduling resolution (a knowledge can fire no more often than this),
# NOT how often any given source actually syncs — that is the per-source resolved schedule below.
# Keep it <= the smallest schedule you expect to use.
app.scheduler.forward-interval=1m
# How often to re-discover iterables for sources with a growing sub-stream set (new folders/channels).
app.scheduler.discovery-interval=60m
# 3-tier forward-sync schedule resolution: a knowledge's own custom schedule (cron/interval) wins;
# else the connector's defaultSchedule() (e.g. LOCAL_FS = 1 day); else this GLOBAL default. Set a
# global cron to pin a wall-clock time instead of an interval (cron wins over interval if both set).
app.scheduler.default-interval=1d
app.scheduler.default-cron=

# ---- Indexing stage (Stage 2: Mongo -> OpenSearch) ----
app.indexing.poll-interval=5s
# Global budget of entities indexed per tick, the per-knowledge quota per tick (round-robin
# fairness so one backlog can't starve others), and the cap on distinct knowledges scanned.
app.indexing.batch=20
app.indexing.per-knowledge=5
app.indexing.max-knowledges=200
app.indexing.concurrency=4
app.indexing.embed-batch=64
app.indexing.lease-seconds=120
# Permit TTL: the indexing permit is held for a WHOLE tick (acquired once, released in finally, not
# renewed mid-tick), so it must exceed the worst-case time to process one tick's batch — comfortably
# above the per-entity lease. Raise if ticks process many slow/large entities.
app.indexing.permits.ttl-seconds=300
app.indexing.retry-limit=5
app.indexing.backoff-seconds=30

# ---- Dev niceties ----
quarkus.log.category."io.personalassistant".level=DEBUG

# ---- Infrastructure ownership ----
# Infra (MongoDB + OpenSearch) is managed by docker-compose, NOT by Quarkus.
# Disable the Compose dev service so the app just connects to the running containers
# instead of trying to start/stop Docker itself.
quarkus.compose.devservices.enabled=false
