# ---- HTTP ----
quarkus.http.port=8080

# ---- Web console ----
# Base of links back into the console, e.g. from a published digest. :5173 targets the dev server.
app.console.url=http://localhost:8080
# Console and API share one origin (Vite proxies /api and /q in dev), so there is no CORS config.
# Don't add any.

# ---- MongoDB (source of truth) ----
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=personal_assistant

# ---- OpenSearch (query engine) ----
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=http
opensearch.index.chunks=chunks

# ---- Embeddings ----
# onnx-bge (local ONNX) | openai-embed (hosted, OpenAI-compatible) | local-hashing (offline baseline).
# Changing the model means re-indexing, even at the same width: two models embed into different spaces.
app.embedding.provider=openai-embed
# Baked into the knn_vector mapping; must equal the active model's output width.
app.embedding.dimension=768
# Used only by local-hashing.
app.embedding.model=local-hashing-v1

# onnx-bge: model-path is a directory with model.onnx, tokenizer.json and config.json (docs/providers.md).
app.embedding.onnx.model=bge-base-en-v1.5
app.embedding.onnx.model-path=
app.embedding.onnx.pooling=cls
app.embedding.onnx.normalize=true
# Prepended to queries only. Blank for a symmetric model; the separating space is added in code.
app.embedding.onnx.query-instruction=Represent this sentence for searching relevant passages:

# openai-embed, defaulting to Gemini's OpenAI-compatible endpoint.
app.embedding.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# Gemini needs the full `models/<id>`: a bare id 404s like a retired model. GET {base-url}/models lists ids.
app.embedding.openai.model=models/gemini-embedding-001
app.embedding.openai.api-key=${GEMINI_API_KEY:}
# Sent as `dimensions`; 0 takes the model's native width (3072 for gemini-embedding-001).
app.embedding.openai.dimensions=768
app.embedding.openai.timeout-seconds=60
# Must stay false against Gemini's OpenAI-compatible endpoint, which rejects task_type with a 400 and so
# fails all indexing.
app.embedding.openai.task-type-enabled=false

# ---- Search (read path) ----
# Display excerpt length; answers use the full chunk. 0 = untruncated.
app.search.snippet-chars=280
# 0 disables highlighting. Only the lexical leg can highlight.
app.search.highlight-fragments=2
# Results (entities), not chunks.
app.search.max-top-k=100
# Chunk candidates per leg per requested result, held between min- and max-candidates.
app.search.candidate-multiplier=10
app.search.min-candidates=100
# Becomes OpenSearch `size` and knn `k` on every leg, so it bounds one request.
app.search.max-candidates=500
# 0 disables the query-vector cache.
app.search.query-vector-cache-size=512
# Blank minimum-should-match sends nothing (any term matches); 0 phrase-boost omits the phrase clause.
app.search.lexical.fields=text,title^2
app.search.lexical.type=best_fields
app.search.lexical.minimum-should-match=2<70%
app.search.lexical.phrase-boost=2.0
app.search.rrf-k=60
app.search.rrf.lexical-weight=1.0
app.search.rrf.vector-weight=1.0
# Matching chunks per result, the best included; 0 = every match. A request's maxChunksPerEntity wins.
app.search.max-chunks-per-entity=3
# Share of each further matching chunk added to an entity's best-chunk score.
app.search.grouping.extra-match-weight=0.1
# Up to +10% for a brand-new result, halving every half-life; 0 turns it off. The date comes from the
# `recency` field set in config/field-sets.json.
app.search.recency.weight=0.1
app.search.recency.half-life-days=14

# ---- Duplicate collapsing (per request: collapseDuplicates) ----
# Shingle width, in tokens.
app.search.dedupe.shingle-size=5
# Jaccard overlap that counts as the same material. High on purpose: a false merge hides a result silently.
app.search.dedupe.near-duplicate-threshold=0.85
# Cap on the O(n^2) near-duplicate pass; the exact layers still apply beyond it.
app.search.dedupe.max-comparisons=100
# Title overlap required before matching text may group two results.
app.search.dedupe.title-similarity=0.5

# ---- LLM (grounded answers) ----
# openai-compat (Groq, Gemini, local Ollama, ...) | none (disables answering).
# A 404 saying the model "does not exist" means a retired model id, not a bad key.
app.llm.provider=openai-compat
app.llm.base-url=https://api.groq.com/openai/v1
app.llm.model=openai/gpt-oss-120b
app.llm.api-key=${GROQ_API_KEY:}
app.llm.temperature=0.2
app.llm.timeout-seconds=60

# ---- LLM profiles: app.llm.profile.<name>.<key> ----
# Keys: base-url, model, temperature, max-tokens, api-key. A missing or blank key inherits app.llm.*,
# except that a profile which changes base-url never inherits the api-key: give it its own.
app.llm.profile.answer.model=openai/gpt-oss-120b
app.llm.profile.answer.temperature=0.2
app.llm.profile.answer.max-tokens=2048
# Bulk and background work (job-fit). On Gemini because Groq's free tier rejects any single request over
# its per-minute token limit with a 413. max-tokens is generous: a thinking model's reasoning counts
# against it, and a truncated reply fails JSON mode. LLM rate limits are keyed by provider id, so Groq
# and Gemini share one counter.
app.llm.profile.lite.base-url=https://generativelanguage.googleapis.com/v1beta/openai
app.llm.profile.lite.model=gemini-3.5-flash-lite
app.llm.profile.lite.api-key=${GEMINI_API_KEY:}
app.llm.profile.lite.temperature=0.0
app.llm.profile.lite.max-tokens=4096

# ---- Answer synthesis ----
# The task in config/prompts.json that answering runs; its budgets live on the task.
app.agent.task=answer
# Optional files that replace the bundled config/prompts.json and config/field-sets.json wholesale.
app.prompts.path=
app.field-sets.path=

# ---- OAuth ----
# The callback redirects only to these origins; anything else would be an open redirect. Each must also
# be registered as a redirect URI on the provider's client.
app.oauth.allowed-origins=http://localhost:8080,http://localhost:5173
# Time allowed to finish the consent screen.
app.oauth.state-ttl-seconds=600

# Google (Gmail, Drive, GMAIL_SEND). Publish the consent screen: while it is in "Testing", Google revokes
# refresh tokens after 7 days.
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.oauth.google.authorize-url=https://accounts.google.com/o/oauth2/v2/auth
app.oauth.google.token-url=https://oauth2.googleapis.com/token

# ---- Connectors: Google ----
app.ingestion.gmail.base-url=https://gmail.googleapis.com/gmail/v1
app.ingestion.gmail.timeout-seconds=60

# Blank download-dir means ${java.io.tmpdir}/psa-drive. max-file-bytes is 25 MiB.
app.ingestion.google-drive.base-url=https://www.googleapis.com/drive/v3
app.ingestion.google-drive.timeout-seconds=60
app.ingestion.google-drive.download-dir=
app.ingestion.google-drive.max-file-bytes=26214400
app.ingestion.google-drive.max-folders=500

# ---- Connectors: ATS job boards ----
app.ingestion.greenhouse.base-url=https://boards-api.greenhouse.io/v1/boards
app.ingestion.greenhouse.timeout-seconds=30
app.ingestion.lever.base-url=https://api.lever.co/v0/postings
app.ingestion.lever.timeout-seconds=30
app.ingestion.ashby.base-url=https://api.ashbyhq.com/posting-api/job-board
app.ingestion.ashby.timeout-seconds=30
app.ingestion.smartrecruiters.base-url=https://api.smartrecruiters.com/v1/companies
app.ingestion.smartrecruiters.timeout-seconds=30
# Workday and Oracle have no base-url: the host comes from each site.
app.ingestion.workday.timeout-seconds=30
app.ingestion.oraclehcm.timeout-seconds=30

# ---- Chunking ----
# recursive | character | fixed-size | token | table. A knowledge's own config.chunking overrides it.
app.chunking.strategy=recursive
# Let content type pick the strategy (tables by row) when a knowledge has not chosen one.
app.chunking.mime-aware=true
# In characters (recursive, character, fixed-size).
app.chunking.size=1000
app.chunking.overlap=150
# In tokens (token strategy). Offline, the tokenizer falls back to ~4 characters per token.
app.chunking.token.size=512
app.chunking.token.overlap=64
app.chunking.token.tokenizer=bert-base-uncased

# ---- Outbound rate limiting ----
# Rules are "<permits>/<window>" (s, m, h or d), comma-separated rolling windows that a call must all
# satisfy, e.g. 10/1s,500/1m,10000/1d. Blank means no limit. An account's own limit overrides these.
# Longest a background call blocks before being deferred; keep well under app.ingestion.lease-seconds.
app.ratelimit.max-wait-seconds=60
# Pause after a 429 with no usable Retry-After.
app.ratelimit.default-retry-after-seconds=60
# Ceiling on a server-supplied Retry-After.
app.ratelimit.max-penalty-seconds=21600
# Consecutive deferrals before dead-lettering. Far above the retry limits: a deferral is not a fault.
app.ratelimit.max-deferrals=20
# redis | memory. No fallback between them: in-memory windows reset on every restart.
app.ratelimit.store=redis
%test.app.ratelimit.store=memory
app.ratelimit.job-boards.rules=
app.ratelimit.llm.rules=
app.ratelimit.embedding.rules=6/1m,120/1d
# Lower ceilings for background calls on the same counter, reserving the gap for searches. Use the same
# window lengths as the rules above; blank means no reserve.
app.ratelimit.llm.background.rules=
app.ratelimit.embedding.background.rules=4/1m,100/1d
# Per connector: app.ratelimit.connector.<SOURCE_TYPE>.rules, e.g.
# app.ratelimit.connector.GMAIL.rules=20/1s,15000/1m

# ---- Ingestion stage (source -> Mongo) ----
app.ingestion.poll-interval=30s
app.ingestion.poll-batch=20
app.ingestion.batches-per-lease=50
app.ingestion.max-items-per-batch=100
# Must exceed the worst-case time for a single page.
app.ingestion.lease-seconds=900
app.ingestion.retry-limit=5
app.ingestion.permits.global=8
app.ingestion.permits.connector=4
app.ingestion.permits.knowledge=2
# Keep >= app.ingestion.lease-seconds.
app.ingestion.permits.ttl-seconds=14400

# ---- Forward scheduler ----
# Tick granularity, not a sync cadence: keep it <= the shortest schedule in use.
app.scheduler.forward-interval=1m
app.scheduler.discovery-interval=60m
# Used when neither the knowledge nor its connector has a schedule. cron wins over interval.
app.scheduler.default-interval=1d
app.scheduler.default-cron=

# ---- Connection health ----
app.connections.health-interval=30m

# ---- Retention ----
app.retention.poll-interval=1h
# Max entities tombstoned per tick.
app.retention.batch=200
# Blank on purpose: unset at every tier means never expire. A global window here would start deleting
# Drive, Gmail and local files.
app.retention.default-period=

# ---- Digests ----
# Tick granularity: keep it <= the shortest digest cadence.
app.digest.poll-interval=5m
app.digest.batch=10
# Over-fetch when reporting only new items, since the already-seen filter runs after retrieval.
app.digest.new-item-multiplier=4

# ---- Publishing ----
app.publishing.poll-interval=30s
app.publishing.batch=20
# Must exceed the slowest single send, or a delivery can go out twice.
app.publishing.lease-seconds=120
app.publishing.retry-limit=5
# First retry delay, doubling up to max-backoff-seconds.
app.publishing.backoff-seconds=60
app.publishing.max-backoff-seconds=3600

# Gmail transport for the EMAIL publisher; lease-seconds above must exceed its timeout.
app.publishing.gmail.base-url=https://gmail.googleapis.com/gmail/v1
app.publishing.gmail.tokeninfo-url=https://oauth2.googleapis.com/tokeninfo
app.publishing.gmail.timeout-seconds=30

# ---- Indexing stage (Mongo -> OpenSearch) ----
app.indexing.poll-interval=5s
# Entities per tick overall and per knowledge (round-robin), and the cap on knowledges scanned.
app.indexing.batch=20
app.indexing.per-knowledge=5
app.indexing.max-knowledges=200
app.indexing.concurrency=4
app.indexing.embed-batch=15
app.indexing.lease-seconds=900
# Held for a whole tick, so it must exceed one tick's worst case.
app.indexing.permits.ttl-seconds=1200
app.indexing.retry-limit=5
app.indexing.backoff-seconds=300
# auto (the connector decides) | always | never: whether a re-index re-fetches from the source.
app.indexing.refetch-on-reindex=auto

# ---- Dev ----
quarkus.log.category."io.personalassistant".level=DEBUG

# ---- Infrastructure: docker-compose owns Mongo, OpenSearch and Redis, not Quarkus dev services ----
quarkus.compose.devservices.enabled=false
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.devservices.enabled=false
