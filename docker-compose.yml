# Local infrastructure for development: MongoDB + OpenSearch.
# Run:  docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: psa-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: psa-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Dev only: disable the security plugin so we can use plain http://localhost:9200
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  mongo-data:
  opensearch-data:
