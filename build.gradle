plugins {
    id 'java'
    id 'io.quarkus'
    id 'com.diffplug.spotless' version '7.2.1'
}

// Formatting hygiene. Deliberately NOT a full reformatter: the hand-maintained layout and dense
// Javadoc here are the house style, and both palantir-java-format and google-java-format currently
// blow up on this JDK (NoSuchMethodError on com.sun.tools.javac Log internals). These four steps are
// the non-destructive subset — they enforce the import convention already used everywhere (static
// first, then one alphabetical block) and kill trailing whitespace. `./gradlew spotlessApply` fixes,
// `spotlessCheck` verifies and is wired into `check` / `build` by the plugin.
spotless {
    java {
        target 'src/*/java/**/*.java'
        removeUnusedImports()
        importOrder('\\#', '')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Quarkus platform BOM — aligns all Quarkus artifact versions.
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    // Core + REST (JAX-RS, reactive) with Jackson JSON.
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'

    // MongoDB (source of truth).
    implementation 'io.quarkus:quarkus-mongodb-client'

    // Health / readiness probes (used by k8s later).
    implementation 'io.quarkus:quarkus-smallrye-health'

    // Scheduler — drives the ingestion/indexing poll loops and forward re-arming.
    implementation 'io.quarkus:quarkus-scheduler'

    // cron-utils — compute the next fire time for a knowledge's custom/connector/global cron
    // schedule (the forward scheduler obeys per-source cadence). Version is managed by the Quarkus
    // BOM (quarkus-scheduler already depends on it), so it stays aligned with the platform.
    implementation 'com.cronutils:cron-utils'

    // OpenSearch clients (query engine). The typed client plus the stable low-level REST client
    // the SearchIndex adapter speaks the query DSL through.
    implementation 'org.opensearch.client:opensearch-java:2.13.0'
    implementation 'org.opensearch.client:opensearch-rest-client:2.13.0'

    // Apache Tika — file text extraction (PDF/DOCX/HTML/…) at indexing time.
    implementation 'org.apache.tika:tika-core:2.9.2'
    implementation 'org.apache.tika:tika-parsers-standard-package:2.9.2'

    // DJL — local, in-JVM embeddings via ONNX Runtime (OnnxEmbeddingProvider). The BOM aligns
    // the api / tokenizers / engine versions. tokenizers brings the HuggingFace tokenizer plus the
    // TextEmbeddingTranslatorFactory (tokenize → model → mean-pool → L2-normalize). onnxruntime-engine
    // is the runtime that actually executes the sentence-transformer .onnx graph; it is only needed at
    // run time, so it is a runtimeOnly dependency. Only exercised when app.embedding.provider=onnx-bge.
    implementation platform('ai.djl:bom:0.28.0')
    implementation 'ai.djl:api'
    implementation 'ai.djl.huggingface:tokenizers'
    runtimeOnly 'ai.djl.onnxruntime:onnxruntime-engine'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
}

// ---- Web console -------------------------------------------------------------------------------
// The React console in `frontend/` builds into src/main/resources/META-INF/resources, which Quarkus
// serves as static content — so the packaged app hands out API and UI from the same origin on :8080
// and no CORS configuration is needed anywhere. Deep links are handled by SpaRoutingConfigurator.
//
// For development, run the Vite dev server instead (`./gradlew frontendDev`, or `npm run dev` in
// frontend/) and use :5173 — it proxies /api and /q to :8080, so that is also a single origin, with
// hot reload. `./gradlew quarkusDev` keeps serving whatever was last built into META-INF/resources.
//
// Deliberately NOT using the Quinoa extension: 2.8.3 fails to register its build-time config root
// against Quarkus 3.33.2 (`quarkus.quinoa.enabled` is reported as an unrecognized key and no npm
// build runs). These few lines do the same job with no version coupling.

def frontendDir = file('frontend')
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npm = isWindows ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
    description = 'Installs the web console dependencies from the lockfile.'
    group = 'frontend'
    workingDir = frontendDir
    // `npm ci` is the reproducible install, but it requires the lockfile; fall back for a first run.
    commandLine npm, file('frontend/package-lock.json').exists() ? 'ci' : 'install'

    inputs.file('frontend/package.json')
    inputs.file('frontend/package-lock.json').optional()
    outputs.dir('frontend/node_modules')
}

tasks.register('frontendBuild', Exec) {
    description = 'Builds the web console into src/main/resources/META-INF/resources.'
    group = 'frontend'
    dependsOn 'frontendInstall'
    workingDir = frontendDir
    commandLine npm, 'run', 'build'

    inputs.dir('frontend/src')
    inputs.files('frontend/package.json', 'frontend/vite.config.ts', 'frontend/index.html')
    outputs.dir('src/main/resources/META-INF/resources')
}

tasks.register('frontendDev', Exec) {
    description = 'Runs the Vite dev server on :5173 with hot reload (proxies the API to :8080).'
    group = 'frontend'
    dependsOn 'frontendInstall'
    workingDir = frontendDir
    commandLine npm, 'run', 'dev'
}

// The UI must be on disk before Quarkus collects resources into the artifact.
processResources.dependsOn 'frontendBuild'

group = 'io.personalassistant'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileJava {
    options.encoding = 'UTF-8'
    // -parameters keeps JAX-RS @PathParam/@QueryParam names at runtime.
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}
